spring.application.name=api-gateway
server.port=8080

# Keycloak issues the bearer tokens accepted by this gateway.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/paynow}

# Route payment API calls through the gateway to the payment service.
spring.cloud.gateway.server.webmvc.routes[0].id=payment-service
spring.cloud.gateway.server.webmvc.routes[0].uri=${PAYMENT_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/payments/**

# Route user profile calls (/users/me) through the gateway to the auth service.
spring.cloud.gateway.server.webmvc.routes[1].id=auth-service
spring.cloud.gateway.server.webmvc.routes[1].uri=${AUTH_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/users/**
