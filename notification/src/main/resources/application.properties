spring.application.name=notification
spring.profiles.active=local
server.port=8089

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

notification.kafka.topic=${NOTIFICATION_KAFKA_TOPIC:notification-kafka-topic}
spring.kafka.consumer.group-id=${CONSUMER_GROUP:notification-service}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.personal.notification.dto.NotificationEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=com.personal.notification.dto,com.personal.notification.entity
spring.kafka.consumer.properties.spring.json.use.type.headers=false