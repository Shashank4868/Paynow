#Application Properties
spring.application.name=auth-service
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
server.port=8083

# Database Configuration (DB_PASSWORD comes from the environment or application-local.properties)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/paynow}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.liquibase.change-log=classpath:db.changelog/db.changelog-master.yaml

# Keycloak runs on 8180 (the gateway owns 8080)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/paynow}

#Keycloak Configuration (KEYCLOAK_CLIENT_SECRET comes from the environment or application-local.properties)
spring.security.oauth2.client.registration.keycloak.provider=keycloak
spring.security.oauth2.client.registration.keycloak.client-id=${KEYCLOAK_CLIENT_ID:paynow}
spring.security.oauth2.client.registration.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET}
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email

# Endpoints are listed explicitly instead of using issuer-uri, which would fetch Keycloak's
# discovery document at startup and stop the service from booting while Keycloak is down.
keycloak.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/paynow}
spring.security.oauth2.client.provider.keycloak.authorization-uri=${keycloak.issuer-uri}/protocol/openid-connect/auth
spring.security.oauth2.client.provider.keycloak.token-uri=${keycloak.issuer-uri}/protocol/openid-connect/token
spring.security.oauth2.client.provider.keycloak.user-info-uri=${keycloak.issuer-uri}/protocol/openid-connect/userinfo
spring.security.oauth2.client.provider.keycloak.jwk-set-uri=${keycloak.issuer-uri}/protocol/openid-connect/certs
spring.security.oauth2.client.provider.keycloak.user-name-attribute=preferred_username
