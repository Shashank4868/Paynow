spring.application.name=paymentService
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
# Values come from environment variables, application-local.properties or .env (working dir).
# Only DB_PASSWORD has no default; see application-local.properties.example / .env.example.
spring.config.import=optional:file:.env[.properties]
server.port=${SERVER_PORT:8081}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/paynow}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.value.default.type=com.personal.payment.kafka.event.FraudDecisionEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false
payment.kafka.created-topic=${PAYMENT_CREATED_TOPIC:payment.created}
payment.kafka.decision-topic=${PAYMENT_DECISION_TOPIC:payment.decision}
payment.kafka.consumer-group-id=${KAFKA_CONSUMER_GROUP_ID:process-payment}
payment.kafka.notification-topic=${NOTIFICATION_KAFKA_TOPIC:notification-kafka-topic}

# Every /payments request must carry a Keycloak access token
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/paynow}
