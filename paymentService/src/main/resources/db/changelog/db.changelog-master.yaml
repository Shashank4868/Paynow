databaseChangeLog:
  - changeSet:
      id: 1
      author: shashank
      changes:
        - createTable:
            tableName: payments
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: sender_id
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    updatable: false

              - column:
                  name: receiver_id
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    updatable: false

              - column:
                  name: amount
                  type: DECIMAL(19,4)
                  constraints:
                    nullable: false

              - column:
                  name: currency
                  type: VARCHAR(3)
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: idempotency_key
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    updatable: false

              - column:
                  name: reference
                  type: VARCHAR(255)

              - column:
                  name: failure_reason
                  type: VARCHAR(255)

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
                    updatable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: payments
            columnNames: idempotency_key
            constraintName: uk_payment_idempotency_key

  - changeSet:
    id: 2
    author: shashank
    changes:
      - addColumn:
          tableName: payments
          columns:
            - column:
                name: senderEmail
                type: VARCHAR(255)
            - sql:
                sql: |
                  ALTER TABLE payments
                  ADD CONSTRAINT chk_sender_email_format
                  CHECK (senderEmail IS NULL OR senderEmail ~* '^[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}$');
      - addColumn:
          tableName: payments
          columns:
            - column:
                name: receiverEmail
                type: VARCHAR(255)
            - sql:
                sql: |
                  ALTER TABLE payments
                  ADD CONSTRAINT chk_receiver_email_format
                  CHECK (receiverEmail IS NULL OR receiverEmail ~* '^[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}$');